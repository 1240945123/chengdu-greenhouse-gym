GreenLightEnv:
  seed: 42
  source_counts:
    random: 2
    baseline: 2
    pid: 2
  max_steps_per_episode: 256
  test_fraction: 0.2

  model:
    input_dim: 44
    output_dim: 28
    hidden_layers: [256, 256, 256]
    activation: silu

  training:
    epochs: 20
    batch_size: 128
    learning_rate: 0.001
    device: cpu

  loss_weights:
    lambda_nonnegative: 0.01
    lambda_temperature: 0.01
    lambda_delta: 0.000001

  evaluation:
    source_counts:
      random: 1
      baseline: 1
      pid: 1
    max_steps_per_episode: 128
    multi_step_rollout_steps: 32


