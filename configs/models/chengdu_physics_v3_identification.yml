schema_version: chengdu-physics-v3-identification
train_csv: data/processed/chengdu_agri/greenhouse_001/trajectories/v3/train.csv
validation_csv: data/processed/chengdu_agri/greenhouse_001/trajectories/v3/val.csv
test_csv: data/processed/chengdu_agri/greenhouse_001/trajectories/v3/test.csv
fit_sample_limit: 160
sensitivity_sample_limit: 96
validation_stride: 12
max_nfev: 14
multistart_factors: [0.7, 1.3]
parameters:
  air_capacity_scale: {index: 208, lower: 2.0, upper: 20.0, initial: 8.0}
  solar_gain_scale: {index: 209, lower: 0.1, upper: 1.0, initial: 0.6}
  envelope_ua_scale: {index: 210, lower: 0.5, upper: 8.0, initial: 2.5}
  roof_exchange_scale: {index: 211, lower: 0.5, upper: 12.0, initial: 8.0}
  co2_exchange_scale: {index: 212, fixed: 0.6, identifiable: false}
  co2_photo_scale: {index: 213, fixed: 1.0, identifiable: false}
  transpiration_scale: {index: 214, lower: 0.1, upper: 5.0, initial: 0.6}
  vapor_exchange_scale: {index: 215, lower: 0.1, upper: 6.0, initial: 3.0}
  background_infiltration_ach: {index: 216, lower: 0.02, upper: 1.5, initial: 0.2}
  fan_exchange_ach: {index: 217, lower: 0.5, upper: 30.0, initial: 8.0}
  pad_cooling_power_w: {index: 218, fixed: 0.0, identifiable: false}
  pad_vapor_source_pa_s: {index: 219, fixed: 0.0, identifiable: false}
