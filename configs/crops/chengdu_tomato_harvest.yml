calibration:
  harvest_area_normalization:
    model_target_area_basis: fixed_configured_production_area
    target_normalization_area_m2: 192.0
    model_fresh_kg_m2_formula: harvested_fresh_kg_divided_by_normalization_area_m2
    actual_harvested_area_role: coverage_and_local_intensity_audit_only
    local_fresh_kg_m2_used_for_fit: false
    harvested_area_must_not_exceed_normalization_area: true
  season_completion_evidence:
    template: data/raw/chengdu_agri/greenhouse_001/crop/harvest_seasons_template.csv
    required_with_harvest_events: true
    complete_status: complete
    complete_season_requires_end_datetime: true
    complete_season_requires_source_record: true
    ongoing_seasons_used_for_fit: false
    accepted_completion_sources:
      - crop_clearance_record
      - final_harvest_and_removal_record
      - production_log_signed_by_site_manager
  driver_construction:
    module: experiments.crop.build_chengdu_harvest_drivers
    manifest: configs/crops/chengdu_harvest_driver_manifest.yml
    current_artifact: results/chengdu_agri_greenhouse_001/harvest_model/drivers/target_partial_harvest_drivers.csv
    current_audit: results/chengdu_agri_greenhouse_001/harvest_model/drivers/target_partial_harvest_driver_audit.json
    current_state_rows: 2650
    current_driver_rows: 2649
    current_span_days: 110.375
    current_mass_accounting_residual_kg_m2: 0.0
    current_calibration_eligible: false
    current_blocking_reasons:
      - crop_model_not_accepted
      - management_protocol_missing
      - season_incomplete
    required_driver_model_status: accepted_target_crop_model
    measured_harvest_timestamps_used_to_build_pick_flags: false
    diagnostic_horizon_extension:
      trajectory_artifact: results/chengdu_agri_greenhouse_001/harvest_model/target_crop_validation/target_crop_trajectory_driver_horizon.csv
      audit_artifact: results/chengdu_agri_greenhouse_001/harvest_model/target_crop_validation/target_crop_trajectory_driver_horizon_audit.json
      start: 2026-04-01T00:00:00+08:00
      end: 2026-07-20T09:00:00+08:00
      canopy_temperature_proxy_rows: 161
      canopy_temperature_proxy_reference_mae_c: 2.4945786210317453
      canopy_temperature_proxy_uncertainty_propagated: false
      status: diagnostic_extrapolation_not_accepted
  fitted_parameters:
    - maturity_thermal_time_deg_day
    - dry_matter_fraction
  base_temperature_c:
    status: must_be_declared_before_target_fit
  maturity_thermal_time_deg_day_bounds: [200.0, 1200.0]
  dry_matter_fraction_bounds: [0.05, 0.12]
  objective_components:
    - batch_wmape
    - cumulative_wmape
    - first_harvest_date_error_days
  split_policy: chronological_complete_seasons
  test_data_used_for_fit: false
  picking_schedule:
    status: must_be_declared_from_management_protocol
    derived_from_observed_harvest_outcome: false

uncertainty:
  dry_matter_fraction: collection_date_block_bootstrap
  harvest_prediction: joint_parameter_refit_and_season_stratified_residual_bootstrap
  parameter_estimation:
    method: season_residual_moving_block_parameter_refit_bootstrap
    bootstrap_samples: 200
    block_days: 7
  prediction_ensemble_samples: 2000
  intervals: [0.80, 0.95]
  bootstrap_seed: 20260727
  scope: conditional_on_supplied_greenlight_drivers_and_model_structure
  output_targets: [batch_fresh_kg_m2, cumulative_fresh_kg_m2]
  block_boundary_policy: never_cross_training_season_boundaries
  forecast_cumulative_reset_policy: reset_for_each_forecast_season
  driver_scenario_ensemble:
    status: optional_not_currently_supplied
    cli_argument: --uncertainty-driver-scenarios
    builder_module: experiments.crop.build_chengdu_harvest_driver_scenarios
    minimum_scenarios: 2
    scenario_sampling_policy: uniform
    parameter_sampling_policy: uniform
    point_driver_implicitly_included: false
    required_columns: [driver_scenario_id, driver_uncertainty_source]
    allowed_sources:
      - greenhouse_climate_model_parameter_uncertainty
      - outdoor_weather_scenario_uncertainty
    invariant_fields:
      - season_id
      - timestamp
      - dt_hours
      - pick
      - pick_source
      - driver_model_status
      - season_complete
      - greenhouse_id
      - greenhouse_code
      - planting_code
    scope_when_supplied: conditional_on_supplied_greenlight_driver_ensemble_and_model_structure
  reported_diagnostics:
    - batch_coverage
    - batch_normalized_mean_width
    - batch_winkler_score
    - cumulative_coverage
    - cumulative_normalized_mean_width
    - cumulative_winkler_score
    - initial_thermal_sum_structural_sensitivity
  not_yet_propagated:
    - greenhouse_climate_model_parameter_uncertainty
    - outdoor_weather_scenario_uncertainty
    - xindu_to_pidu_site_transfer_uncertainty
    - structural_uncertainty_of_dry_matter_age_cohorts

