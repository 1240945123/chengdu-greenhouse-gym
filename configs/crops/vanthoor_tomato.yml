model:
  name: Vanthoor2011_GreenLight
  crop: greenhouse tomato
  source_doi: 10.1016/j.biosystemseng.2011.08.005
  source_title: "A methodology for model-based greenhouse design: Part 2, description and validation of a tomato yield model"

implementation:
  module: glassgym.models.GreenLight.crop
  greenlight_doi: 10.1016/j.biosystemseng.2020.03.010
  climate_backend: ChengduPhysics
  crop_state_indices: [22, 23, 24, 25, 26, 27]
  greenlight_parameter_indices: [0, 207]
  chengdu_climate_multiplier_indices: [208, 215]
  harvest_flux: fruit_harvest
  harvest_integration: trapezoidal_per_environment_step
  production_metric: harvested_fruit_plus_final_minus_initial_fruit_carbon
  carbohydrate_buffer_nonnegative_guard:
    method: near_zero_continuous_availability_gate
    scale_mg_m2: 1.0
    purpose: prevent_nonphysical_organ_allocation_from_empty_buffer
    normal_buffer_effect: below_0_1_percent_at_1000_mg_m2

parameterization:
  source: glassgym.configs.default_params
  target_site_harvest_calibrated: false
  cultivar_calibrated: false
  dry_matter_fraction: 0.0627
