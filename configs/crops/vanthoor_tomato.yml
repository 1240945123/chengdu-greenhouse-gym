external_validation:
  location: Pengzhou, Chengdu, Sichuan, China
  greenhouse_type: multi-span plastic greenhouse
  fresh_yield_kg_m2: [10.1625, 10.314]
  reported_yield_kg_ha: [101625, 103140]
  planting_density_plants_ha: 29430
  single_fruit_mass_kg: [0.18, 0.19]
  source_doi: 10.13733/j.jcam.issn.2095-5553.2024.05.010
  use: plausibility_only
  calibration_target: false

limitations:
  - No measured harvest series from the target Chengdu Pidu multi-span plastic greenhouse.
  - The external reference uses a different greenhouse type, cultivar, and management regime.
  - Heating and CO2 injection are disabled in the controller benchmark.
  - Yield must be reported as simulated until target-site harvest data are available.
  - The measured 0.08101 dry-matter fraction is from Xindu standing-fruit samples, not Pidu harvest events.
