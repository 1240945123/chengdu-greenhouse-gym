  status_label: literature_parameterized_simulated_yield
  chengdu_source_site_fruit_dry_matter_fraction:
    estimate: 0.08100858543455298
    ci95: [0.07582388370007698, 0.08461793001033059]
    source_greenhouse_code: GH2024
    use: source_site_precalibration_only
  target_parameter_index_updated: false

